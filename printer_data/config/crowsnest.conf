#### crowsnest.conf
#### Restored from pre-Trixie install; added exposure_dynamic_framerate=0 (C920 holds fps)

[crowsnest]
log_level: verbose                      # quiet/verbose/debug
no_proxy: false

[cam 1]
mode: camera-streamer
device: /dev/video0
#resolution: 1920x1080
resolution: 1280x720
max_fps: 30
port: 8080
v4l2ctl: focus_automatic_continuous=0,focus_absolute=0,exposure_dynamic_framerate=0
