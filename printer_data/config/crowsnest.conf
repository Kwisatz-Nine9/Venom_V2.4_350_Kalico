#### crowsnest.conf - Venom24
#### Camera: Sonix USB 2.0 (Luke's Laboratory high-temp), manual-focus lens
#### Replaced Logitech C920 (C920 dropped ~1-2% of frames at 1080p -> black flashes)

[crowsnest]
log_level: verbose                      # quiet/verbose/debug
no_proxy: false

[cam 1]
mode: camera-streamer
device: /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB_2.0_Camera-video-index0
resolution: 1920x1080
max_fps: 30
port: 8080
v4l2ctl: power_line_frequency=2
