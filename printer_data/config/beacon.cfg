[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_CB67B19B5157355957202020FF0E2A25-if00
x_offset: 0   # update with offset from nozzle on your machine
y_offset: 30  # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
contact_max_hotend_temperature: 190 # increase to probe at print temps
autocal_tolerance: 0.012
contact_sensitivity: 1
default_probe_method: contact     # magnets distort proximity readings; contact is immune
contact_mesh_min: 25, 25
contact_mesh_max: 325, 300    # coil is 30mm behind nozzle; Y300 keeps it 20mm inside the back edge

accel_axes_map: -x, -y, z

home_gcode_pre_y: G4 P2000
home_xy_position: 175, 175 # update with your safe position
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: contact # use proximity for induction homing
home_method_when_homed: proximity # after initial calibration use induction
home_autocalibrate: unhomed # contact will calibrate beacon on first home
trigger_dive_threshold: 1.5   # default 1.0; adaptive QGL passes sit at 3mm, this keeps them in-range (no dive) up to 3.5mm
lift_speed: 15                # default = speed (5mm/s); used for QGL lifts and Z adjustments


















