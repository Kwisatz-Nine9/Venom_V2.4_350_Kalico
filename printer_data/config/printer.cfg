#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 720000

#[safe_z_home]
#home_xy_position: 175, 175 # update for your machine
#z_hop: 3
##  [safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
##  home_xy_position:175,175
##  speed:100
##  z_hop:10
##  z_hop_speed:10


##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]

#--------------------------------------------------------------------

##  Gantry Corners for 350mm Build
##  Uncomment for 350mm build
gantry_corners:
   -60,5        # was -60,-10  (+15 Y shift)
   410,435      # was 410,420  (+15 Y shift)
points:
   50,20        # Z  front-left  - Beacon measures at 50,50
   50,270       # Z1 rear-left   - Beacon measures at 50,300
   300,270      # Z2 rear-right  - Beacon measures at 300,300
   300,20       # Z3 front-right - Beacon measures at 300,50

#--------------------------------------------------------------------
speed: 300
horizontal_move_z: 10
adaptive_horizontal_move_z: True
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

#####################################################################
#   Displays
#####################################################################

#--------------------------------------------------------------------

#####################################################################
#   Functions
#####################################################################
[bed_mesh]
speed: 300
horizontal_move_z: 5
mesh_min: 25, 40      # Beacon can't reach below Y36 now
mesh_max: 325, 325
probe_count: 7, 7
algorithm: bicubic
zero_reference_position: 175, 145   # Beacon adds y_offset (+30) in contact mode → resolves to 175,175 (contact Z home point)

#####################################################################
#   Macros
#####################################################################

[gcode_shell_command install_zstandard]
command: /home/pi/klippy-env/bin/pip install zstandard
timeout: 30.0
verbose: True


#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
[gcode_macro PRINT_END]
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 30, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-7.0 F1800                 ; retract filament

    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=BedFans SPEED=0

    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 30} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    BED_MESH_CLEAR
    lights_off
    set_logo_leds_off
