# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Z Endstop Switch location            [safe_z_home] section
## Homing end position                  [gcode_macro G32] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## Probe points                         [quad_gantry_level] section
## Min & Max gantry corner postions     [quad_gantry_level] section
## PID tune                             [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
### Fine tune E steps                    [extruder] section

[mcu]
##--------------------------------------------------------------------
#serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_3F0022000450335331383820-if00
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_37000B000851313339373836-if00
restart_method: command
##--------------------------------------------------------------------
[mcu H36_combo]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3D0037000950415742363820-if00
restart_method: command
##--------------------------------------------------------------------


##--------------------------------------------------------------------





###-----------GENERIC INCLUDES AND ENABLES-----------###

# Enable arcs support - FOR ORCA
[gcode_arcs]
resolution: 0.1

[auto_speed]
axis: diag_x, diag_y
max_missed: 10.0
settling_home: 1
###--------END OF GENERIC INCLUDES AND ENABLES--------###

[printer]
kinematics: corexy
max_velocity: 750          # bring-up; restore after AUTO_SPEED on 2240/34.4V
max_accel: 25000            # bring-up; was 20000 (2209 torture test), daily 10000
max_z_velocity: 30          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 150
square_corner_velocity: 5.0

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 64
full_steps_per_rotation:200  #set to 200 for 1.8 degree stepper
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: 0
##--------------------------------------------------------------------
##  Uncomment for 350mm build
position_endstop: 350
position_max: 350

##--------------------------------------------------------------------
homing_speed: 75   #Max 100
homing_retract_dist: 10     # was 0; Kalico backs off 10mm after sensorless home
min_home_dist: 10           # if closer than this to the endstop, move away before homing
homing_positive_dir: true

##  Make sure to update below for your relevant driver
[tmc2240 stepper_x]
driver_SLOPE_CONTROL: 3   # faster switching edges; default 0 overheats Y driver at 60kHz fchop (chopper-autotune note 10/17)
driver_TBL: 0
driver_TOFF: 5
driver_HSTRT: 6
driver_HEND: 9
driver_SGT: 2             # 2240 SG2: -64 (most sensitive) to 63
driver_TPFD: 3            # DEBUG NOTE, VALUE ON THE MOVE FOR TESTING
cs_pin: PC4
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
rref: 12000               # BTT TMC2240 V1.0: IFS 3A => 12k
run_current: 1.3          # chip max 2.12A RMS
home_current: 0.5         # Kalico native; floor ~0.27A at this range
interpolate: False
diag0_pin: ^!PG6          # BTT 2240 exposes DIAG0, open-drain active-low


##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 64
full_steps_per_rotation:200  #set to 200 for 1.8 degree stepper
endstop_pin: tmc2240_stepper_y:virtual_endstop
##--------------------------------------------------------------------

##  Uncomment for 350mm build
position_endstop: 365
position_max: 365
position_min: 6
##--------------------------------------------------------------------
homing_speed: 75  #Max 100
homing_retract_dist: 10     # was 0; Kalico backs off 10mm after sensorless home
min_home_dist: 10           # if closer than this to the endstop, move away before homing
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2240 stepper_y]
driver_SLOPE_CONTROL: 3   # faster switching edges; default 0 overheats Y driver at 60kHz fchop (chopper-autotune note 10/17)
driver_TBL: 0
driver_TOFF: 2
driver_HSTRT: 5
driver_HEND: 12
driver_TPFD: 12
driver_SGT: 2
cs_pin: PD11
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
rref: 12000
run_current: 1.3
home_current: 0.5
interpolate: False
diag0_pin: ^!PG9
 
#####################################################################
#   Z Stepper Settings
#####################################################################
##  !!! MOTOR_3 SLOT IS DEAD - DO NOT USE !!!
##  Octopus Pro V1.1 MOTOR_3 (EN PA0 / STEP PG4 / DIR PC1 / CS PC7) has a
##  board-side enable fault: driver never sees EN (IOIN drv_enn stays 1 when
##  enabled). Confirmed 2026-10-13 - fault stayed with the slot across a
##  different motor cable AND a brand-new TMC2240.
##  Z1-Z3 were each shifted down one slot to skip it (keeps Z order intact):
##     Z0 -> MOTOR_2 (unchanged)
##     Z1 -> MOTOR_4   (was MOTOR_3)
##     Z2 -> MOTOR_5   (was MOTOR_4)
##     Z3 -> MOTOR_6   (was MOTOR_5)
##  Each motor keeps its own dir_pin polarity (follows the motor, not the slot).
##  Spare slot remaining: MOTOR_7 (EN PE0 / STEP PE6 / DIR PA14 / CS PD3)
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 9:1
microsteps: 32
endstop_pin: probe:z_virtual_endstop # use beacon as virtual endstop
homing_retract_dist: 0 # beacon needs this to be set to 0
position_max: 275
position_min: -5
homing_speed: 10
second_homing_speed: 10

[tmc2240 stepper_z]
cs_pin: PC6
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
rref: 12000
run_current: 0.8

## Z1 Stepper - Rear Left
##  Connected to MOTOR_4 (was MOTOR_3 - dead slot, see header)
[stepper_z1]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 9:1
microsteps: 32

[tmc2240 stepper_z1]
cs_pin: PF2
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
rref: 12000
run_current: 0.8

## Z2 Stepper - Rear Right
##  Connected to MOTOR_5 (was MOTOR_4)
[stepper_z2]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 9:1
microsteps: 32

[tmc2240 stepper_z2]
cs_pin: PE4
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
rref: 12000
run_current: 0.8

## Z3 Stepper - Front Right
##  Connected to MOTOR_6 (was MOTOR_5)
[stepper_z3]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
rotation_distance: 40
gear_ratio: 9:1
microsteps: 32

[tmc2240 stepper_z3]
cs_pin: PE1
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
rref: 12000
run_current: 0.8

#####################################################################
#   Extruder
#####################################################################

[extruder]
#control: mpc
heater_power: 80              # <-- your cartridge's nameplate watts
cooling_fan: fan              # your part-cooling fan; MPC models its cooling effect
filament_diameter: 1.75
filament_density: 1.20        # Kalico defaults; per-material values can be set later
filament_heat_capacity: 1.8
step_pin: H36_combo:PB9
dir_pin: !H36_combo:PB8
#enable_pin: H36_combo:PB7
enable_pin: !H36_combo:PB7    # inverted: driver enable is active-low on this board/firmware

rotation_distance: 4.637             #Orbiter2.5

##  Update Gear Ratio depending on your Extruder Type
#gear_ratio: 50:10    #CW2
#gear_ratio: 9:1      #G2e
#gear_ratio: 9:1       #Orbiter2.5
#microsteps: 32       #CW2  
microsteps: 16        #G2E and Orbiter2.5
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree


nozzle_diameter: 0.400
heater_pin: H36_combo: PA7
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
#sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_type: PT1000
sensor_pin: H36_combo:PA6
pullup_resistor: 2200
min_temp: 10
max_temp: 425
max_power: 1.0
min_extrude_temp: 20
max_extrude_only_distance: 500
#pressure_advance: 0.05
##  Default is 0.040, leave stock
#pressure_advance_smooth_time: 0.040
max_extrude_cross_section: 5000.0

[tmc2209 extruder]
uart_pin: H36_combo:PC14
sense_resistor: 0.110
run_current: 0.750
interpolate: false
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4


#####################################################################
#   Bed Heater
#####################################################################


##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PA1
##  Validate the following thermistor type to make sure it is correct
##  Keenovo branded bed heaters should use Generic 3950
##  LDO branded bed heaters will have the sensor type labelled on the heater
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: Generic 3950
#sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF3
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 1.0
min_temp: 0
max_temp: 130
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

