#####################################################################
#   Fan Control
#####################################################################

##  Print Cooling Fan - FAN0
[multi_pin hotend_fans]
pins: H36_combo:PB13, H36_combo:PA5  # Replace with your two fan port pins

[fan]
pin= multi_pin:hotend_fans
hardware_pwm: False
cycle_time: 0.00004 # 25 kHz
#tachometer_pin: 
#tachometer_ppr: 
min_power: 0.10

## HOT END FAN - FAN1
[heater_fan hotend_fan]
pin: H36_combo:PA9
tachometer_pin: H36_combo:PC6
tachometer_ppr: 2
tachometer_poll_interval: 0.0009
max_power: 1.0
heater: extruder
heater_temp: 50.0
shutdown_speed: 1.0

##  Controller fan - FAN2
[multi_pin skirt_fan]
pins: PD12, PD14

[controller_fan controller_fan]
pin= multi_pin:skirt_fan
kick_start_time: 0.5
heater: heater_bed
fan_speed: 0.60

[controller_fan stepper_fan]
pin: PE5
stepper: stepper_x, stepper_y, stepper_z
hardware_pwm: True
cycle_time: 0.00004
idle_timeout: 600
kick_start_time: 1.0
fan_speed: 1.0         # was default 1.0 - noise; watch TMC2240 temps (DUMP_TMC REGISTER=ADC_TEMP)

[fan_generic BedFans]
pin: PD13
max_power: 1.0          # optional, default 1.0 = full 100%
cycle_time: 0.01        # optional, for smoother PWM if your fans need it (0.01–0.1 common)
kick_start_time: 0.100  # optional, helps fans spin up from 0% reliably
shutdown_speed: 0.0

