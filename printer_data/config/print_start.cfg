#####################################################################
#   print_start macro
#####################################################################


[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer. Such as bed temp, extruder temp, chamber temp and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("40")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  {% set MATERIAL = params.MATERIAL|default("material") %}
  {% set probe_temp = 180 %}
  {% if MATERIAL == "PLA" or target_extruder < 200 %}
    {% set probe_temp = 120 %}
  {% endif %}

  # Bed Temp Soak Time Define:
  {% if target_bed < 70 %}
    {% set soak_time = 60000 %}
  {% elif target_bed < 90 %}
    {% set soak_time = 180000 %}
  {% elif target_bed < 110 %}
    {% set soak_time = 300000 %}
  {% elif target_bed >= 110 %}
    {% set soak_time = 600000 %}
  {% endif %}

  #-----Initialize-----#
  LIGHTS_ON
  RESPOND MSG="Initilizing..."
  SET_GCODE_OFFSET Z=0
  BED_MESH_CLEAR       # Clears old saved bed mesh (if any)

  # Homes the printer, sets absolute positioning and updates the Stealthburner leds.
  STATUS_HOMING         # Sets SB-leds to homing-mode
  G28                   # Full home (XYZ)
  G90                   # Absolut position
    
  #SET_FAN_SPEED FAN=nevermore_fan SPEED=0

  # Insert right before heating extruder or bed
    # (e.g. M104, M109, M190, ...)

  # Bed Temp Stabilize Soak
  SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
  STATUS_HEATING
  M106 S255
  SET_FAN_SPEED FAN=BedFans SPEED=0.5
  G1 X{x_wait} Y{y_wait} Z2 F9000
  M190 S{target_bed}
  SET_FAN_SPEED FAN=BedFans SPEED=1.0
  SET_DISPLAY_TEXT MSG="Heatsoak: {soak_time // 60000}min"
  G4 P{soak_time}
  # Chamber temp waits
  {% if target_bed >= 90 %}
    SET_DISPLAY_TEXT MSG="Chamber: {target_chamber}c"
    TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber_Temp" MINIMUM={target_chamber}
  {% endif %}



  # Heating nozzle to 150 degrees. This helps with getting a correct Z-home
  SET_DISPLAY_TEXT MSG="Hotend: {probe_temp}c"          # Displays info
  STATUS_HEATING
  M109 S{probe_temp}

  
  ##  Uncomment for V2 (Quad gantry level AKA QGL)
  SET_DISPLAY_TEXT MSG="Calibrating Z"         # Displays info
  STATUS_LEVELING                 # Sets SB-leds to leveling-mode
  G28 Z METHOD=CONTACT CALIBRATE=1

  SET_DISPLAY_TEXT MSG="QGL"      # Displays info
  quad_gantry_level               # Levels the buildplate via QGL

  SET_DISPLAY_TEXT MSG="Bed mesh"
  STATUS_MESHING
  BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=10

  SET_DISPLAY_TEXT MSG="Calibrating Z offset"
  G28 Z METHOD=CONTACT CALIBRATE=0                     # Homes Z again after QGL

  MR_NOTIFY TITLE="$printer_name" MESSAGE=" is almost ready to print"


  ## Heats up the nozzle up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"               # Displays info
  STATUS_HEATING                                                  # Sets SB-leds to heating-mode
  M107                                                            # Turns off partcooling fan
  M109 S{target_extruder}                                         # Heats the nozzle to printing temp                                  

  {% if target_extruder < 200 %}
      {% set z_offset_adjust = 0 %}
  {% elif target_extruder < 240 %}
      {% set z_offset_adjust = 0 %}
  {% elif target_extruder < 280 %}
      {% set z_offset_adjust = 0 %}
  {% elif target_extruder < 320 %}
      {% set z_offset_adjust = 0 %}
  {% elif target_extruder >= 320 %}
      {% set z_offset_adjust = 0 %}
  {% endif %}

  SET_GCODE_OFFSET Z_ADJUST={z_offset_adjust} MOVE=1               # Sets TEMP based Z offset  
  Smart_Park
  # Gets ready to print by doing a purge line and updating the SB-leds
  SET_DISPLAY_TEXT MSG="Printer go brrrr"                          # Displays info
  STATUS_PRINTING                                                  # Sets SB-leds to printing-mode
  Line_Purge                                                       # Performs KAMP adaptive Line purge

