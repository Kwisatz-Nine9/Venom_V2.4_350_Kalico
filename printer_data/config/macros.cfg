###############################################################################
#          PARKING
###############################################################################

# Park front center
[gcode_macro PARKFRONT]
gcode:
    CG28
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z{printer.toolhead.axis_maximum.z/2} F19500        
    RESTORE_GCODE_STATE NAME=PARKFRONT
    
# Park front center, but low down
[gcode_macro PARKFRONTLOW]
gcode:
    G28
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z20 F19500                                     
    RESTORE_GCODE_STATE NAME=PARKFRONT
    
# Park top rear left
[gcode_macro PARKREAR]
gcode:
    G28
    SAVE_GCODE_STATE NAME=PARKREAR
    G90
    G0 X{printer.toolhead.axis_minimum.x+10} Y{printer.toolhead.axis_maximum.y-10} Z{printer.toolhead.axis_maximum.z-50} F19500     
    RESTORE_GCODE_STATE NAME=PARKREAR

# Park center of build volume
[gcode_macro PARKCENTER]
gcode:
    G28
    SAVE_GCODE_STATE NAME=PARKCENTER
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z{printer.toolhead.axis_maximum.z/2} F19500    
    RESTORE_GCODE_STATE NAME=PARKCENTER
    
# Park 15mm above center of bed
[gcode_macro PARKBED]
gcode:
    G28
    SAVE_GCODE_STATE NAME=PARKBED
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z15 F19500                                     
    RESTORE_GCODE_STATE NAME=PARKBED


###############################################################################
#          TEMPERATURE
###############################################################################

[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-2} MAXIMUM={s+5}   ; MPC: sensor may settle slightly off target (Kalico MPC docs)        
    {% endif %}


###############################################################################
#          Utilities
###############################################################################

[gcode_macro Belt_Tension]
description: A macro that assists with repeatable belt tensioning.

variable_y_tensioning_position: 130       #Position the printhead needs to be to have 150mm of belt length exposed for belt tensioning.

gcode:
    {% set x_max = printer.configfile.settings.stepper_x.position_max %}
    {% set travel_speed = printer.configfile.settings.printer.max_velocity %}

    G0 X{x_max/2} Y{y_tensioning_position} F{travel_speed*60}
    { action_respond_info( "Tension A/B belts to 110hz @ X: {}, Y: {}".format(x_max/2, y_tensioning_position) ) }



[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True

# =============================================================================
# XY Motion Break-In
# Patterns (per cycle):
#   1. X diagonals  - traces an X corner-to-corner repeatedly
#   2. X sweeps     - horizontal stripes, alternating direction (like bed mesh X)
#   3. Y sweeps     - vertical stripes, alternating direction (like bed mesh Y)
#
# Usage:
#   MOTION_BREAK_IN                           ; defaults
#   MOTION_BREAK_IN SPEED=300 ACCEL=3000      ; custom
#
# Stop:  CANCEL_PRINT  (graceful, clears queue)
#        M112          (emergency stop)
#
# Tuning:
#   CYCLES  - total full cycles queued at start. Default 200 ~ 1-2hrs at 400mm/s
#   STEPS   - number of lines per sweep pattern. Default 10
#   MARGIN  - mm inside axis maximums. Default 30
# =============================================================================

[gcode_macro MOTION_BREAK_IN]
description: XY break-in: X diagonals, X sweeps, Y sweeps. Repeats. Stop with CANCEL_PRINT.
gcode:
    {% set speed  = params.SPEED|default(400)|float %}
    {% set accel  = params.ACCEL|default(5000)|float %}
    {% set margin = params.MARGIN|default(30)|float %}
    {% set z      = params.Z|default(50)|float %}
    {% set steps  = params.STEPS|default(10)|int %}
    {% set cycles = params.CYCLES|default(200)|int %}

    # -- Derive bounds from printer maximums --
    {% set min_x = margin %}
    {% set max_x = printer.toolhead.axis_maximum.x - margin %}
    {% set min_y = margin %}
    {% set max_y = printer.toolhead.axis_maximum.y - margin %}

    # -- Step sizes for sweep patterns --
    {% set x_step = ((max_x - min_x) / (steps - 1)) %}
    {% set y_step = ((max_y - min_y) / (steps - 1)) %}

    # -- G1 feedrate in mm/min --
    {% set fr = (speed * 60)|int %}

    {% if printer.toolhead.homed_axes != "xyz" %}
        RESPOND MSG="Break-in: not homed - homing first..."
        G28
    {% endif %}

    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel}
    G90
    G1 Z{z} F3000

    RESPOND MSG="Break-in: {cycles} cycles | {speed}mm/s | {accel}mm/s2 | CANCEL_PRINT to stop"

    {% for cycle in range(cycles) %}

        # -------------------------------------------------------
        # Pattern 1: X diagonals
        # SW->NE, NE->SW (one stroke), then NW->SE, SE->NW (cross stroke)
        # Repeated twice per cycle for extra diagonal time
        # -------------------------------------------------------
        {% for pass in range(2) %}
            G1 X{min_x} Y{min_y} F{fr}
            G1 X{max_x} Y{max_y} F{fr}
            G1 X{min_x} Y{min_y} F{fr}
            G1 X{max_x} Y{min_y} F{fr}
            G1 X{min_x} Y{max_y} F{fr}
            G1 X{max_x} Y{min_y} F{fr}
        {% endfor %}

        # -------------------------------------------------------
        # Pattern 2: X sweeps (horizontal, alternating direction)
        # Steps through Y range, each line runs full X travel
        # -------------------------------------------------------
        {% for i in range(steps) %}
            {% set y = (min_y + i * y_step)|round(1) %}
            {% if i % 2 == 0 %}
                G1 X{min_x} Y{y} F{fr}
                G1 X{max_x} Y{y} F{fr}
            {% else %}
                G1 X{max_x} Y{y} F{fr}
                G1 X{min_x} Y{y} F{fr}
            {% endif %}
        {% endfor %}

        # -------------------------------------------------------
        # Pattern 3: Y sweeps (vertical, alternating direction)
        # Steps through X range, each line runs full Y travel
        # -------------------------------------------------------
        {% for i in range(steps) %}
            {% set x = (min_x + i * x_step)|round(1) %}
            {% if i % 2 == 0 %}
                G1 X{x} Y{min_y} F{fr}
                G1 X{x} Y{max_y} F{fr}
            {% else %}
                G1 X{x} Y{max_y} F{fr}
                G1 X{x} Y{min_y} F{fr}
            {% endif %}
        {% endfor %}

    {% endfor %}

    # -- Reached only if CYCLES exhausts naturally (not stopped) --
    RESPOND MSG="Break-in complete: {cycles} cycles finished."
    SET_VELOCITY_LIMIT VELOCITY=800 ACCEL=10000

